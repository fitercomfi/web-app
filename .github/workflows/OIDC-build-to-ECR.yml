name: Fineract Comfi Dev UI - Build and Push to ECR using OIDC

on:
  push:
    branches:
      - COM-4

env:
  ecr_repository: fineract/comfi-eu-north-1/dev/ui
  ecr_deploy_role: arn:aws:iam::126919341121:role/comfi-eu-north-1-dev-ghdeploy-role-webapp
  ecr_region: eu-north-1

jobs:
  image_to_ecr_dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          fetch-depth: 0

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ecr_deploy_role }}
          aws-region: ${{ env.ecr_region }}
          web-identity-token-file: ${{ steps.id-token.outputs.token }}

      - name: Get the current commit hash
        id: commit
        run: echo "::set-output name=hash::$(git rev-parse HEAD)"

      - name: Get the short commit message
        id: short-commit-message
        run: echo "::set-output name=commit_hash::$(git rev-parse --short HEAD)"


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository }}
          COMMIT_HASH: ${{ steps.short-commit-message.outputs.commit_hash }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH

      - name: Print image tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repository }}
          COMMIT_HASH: ${{ steps.short-commit-message.outputs.commit_hash }}
        run: echo "The image has been pushed to $ECR_REGISTRY/$ECR_REPOSITORY:latest and $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_HASH"
